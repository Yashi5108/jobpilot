services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ${JOBPILOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/jobpilot/jobpilot.db}
      RESUME_STORAGE_DIR: ${RESUME_STORAGE_DIR:-/data/jobpilot/resumes}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jobpilot_data:/data/jobpilot
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - ${JOBPILOT_ENV_FILE:-.env}
    environment:
      JOBPILOT_API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  jobpilot_data:
  ollama_data: